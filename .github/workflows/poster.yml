name: Poster

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: poster-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The poster asks for Helvetica Neue, which Linux does not ship. Liberation
      # Sans is metric-compatible with Arial, the last entry in the font stack,
      # so the layout measures close to what macOS produces. Close, not
      # identical -- reproduce marginal fit failures locally before reworking.
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-liberation

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      # Fails the build if the content no longer fits the fixed page height.
      # Overflow is otherwise invisible: it is clipped off the printed page.
      - name: Check the poster fits its page
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: python3 scripts/poster.py check

      - name: Build PDF, preview and flex viewer
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: python3 scripts/poster.py all

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: poster
          path: |
            build/poster.pdf
            build/poster-preview.png
            poster/poster-flex.html
          if-no-files-found: error

      - name: Assemble the Pages site
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          cp poster/poster-flex.html site/index.html
          cp -r poster/images site/images
          cp build/poster.pdf build/poster-preview.png site/

      - name: Upload the Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishes the scaling viewer so reviewers get a URL instead of a 34x44in PDF.
  # Requires Settings > Pages > Source: GitHub Actions.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
