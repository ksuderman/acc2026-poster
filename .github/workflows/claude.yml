name: Claude

# Responds when someone writes @claude in an issue, a pull request comment, or
# a review. Only users with write access to the repository can trigger it.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Claude needs these to run `scripts/poster.py check` on its own edits.
      # Without them it can change the poster but cannot verify it still fits.
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-liberation

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      # TEMPORARY diagnostic. Prints no part of the token -- only its length,
      # whether it has the expected prefix, and whether stray whitespace crept
      # in during copy/paste. Remove once @claude is working.
      - name: Check the token secret arrived intact
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "length: ${#TOKEN}"
          case "$TOKEN" in
            sk-ant-oat01-*) echo "prefix: ok" ;;
            "")             echo "prefix: SECRET IS EMPTY" ;;
            *)              echo "prefix: UNEXPECTED - not an OAuth token" ;;
          esac
          case "$TOKEN" in
            *[![:print:]]*) echo "whitespace: CONTAINS a newline or control character" ;;
            *' '*)          echo "whitespace: CONTAINS a space" ;;
            *)              echo "whitespace: clean" ;;
          esac

      - uses: anthropics/claude-code-action@v1
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 40
